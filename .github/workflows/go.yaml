name: build-git-get

on: [push]

permissions:
  contents: write

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      # UPDATE_HERE
      # https://github.com/actions/checkout/releases
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      # UPDATE_HERE
      # https://github.com/jdx/mise-action/releases
      - name: Install mise & tools
        uses: jdx/mise-action@v5
        # UPDATE_HERE
        # https://github.com/jdx/mise/releases
        with:
          version: 2026.11.9

      - name: Check out full code history
        run: |
          git fetch --prune --unshallow
          git pull --tags

      - name: Test and Build
        run: |
          make

      # UPDATE_HERE
      # https://github.com/slackapi/slack-github-action/releases
      - name: Slack Notification
        uses: slackapi/slack-github-action@v4
        if: always()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.workflow }} / ${{ github.job }}: ${{ job.status }}"
            attachments:
              - color: "${{ job.status == 'success' && 'good' || (job.status == 'cancelled' && 'warning' || 'danger') }}"
                fields:
                  - title: "repo"
                    value: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                    short: true
                  - title: "message"
                    value: ${{ toJSON(format('<{0}|{1}>', github.event.head_commit.url, github.event.head_commit.message)) }}
                    short: true

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      # UPDATE_HERE
      # https://github.com/actions/checkout/releases
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      # UPDATE_HERE
      # https://github.com/jdx/mise-action/releases
      - name: Install mise & tools
        uses: jdx/mise-action@v5
        # UPDATE_HERE
        # https://github.com/jdx/mise/releases
        with:
          version: 2026.11.9

      - name: Check out full code history
        run: |
          git fetch --prune --unshallow
          git pull --tags

      - name: Test and Build
        run: |
          make

      - name: Release
        shell: bash
        run: |
          git tag "$(svu next --always)"
          git push --tags
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # UPDATE_HERE
      # https://github.com/slackapi/slack-github-action/releases
      - name: Slack Notification
        uses: slackapi/slack-github-action@v4
        if: always()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.workflow }} / ${{ github.job }}: ${{ job.status }}"
            attachments:
              - color: "${{ job.status == 'success' && 'good' || (job.status == 'cancelled' && 'warning' || 'danger') }}"
                fields:
                  - title: "repo"
                    value: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                    short: true
                  - title: "message"
                    value: ${{ toJSON(format('<{0}|{1}>', github.event.head_commit.url, github.event.head_commit.message)) }}
                    short: true
